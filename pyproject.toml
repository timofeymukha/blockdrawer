[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockdrawer"
version = "0.1.0"
description = "A graphical block-topology editor that exports OpenFOAM blockMeshDict files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.gui-scripts]
blockdrawer = "blockdrawer.app:main"

[project.scripts]
blockdrawer-cli = "blockdrawer.cli:main"
blockdrawer-mcp = "blockdrawer.mcp_server:main"
blockdrawer-web = "blockdrawer.web.__main__:main"

[project.optional-dependencies]
png = ["Pillow>=10.1"]
mcp = ["mcp>=2,<3", "Pillow>=10.1"]

[tool.setuptools.packages.find]
include = ["blockdrawer*"]

[tool.setuptools.package-data]
"blockdrawer.web" = ["static/*"]
